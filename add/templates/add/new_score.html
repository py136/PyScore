{%extends "op/base.html"%}  
  
{%block content%}  
<div class="container mt-5"> 
    <h3 class="text-center mb-4">添加积分情况</h3>  
    <form method="POST" class="form-group" action="{% url 'add:add_score' %}">  
        {% csrf_token %}  
        详细情况：
        <textarea name="entry" rows="3" cols="50"  required></textarea><br>
        分数：<input type="number" name="score" min="-100" max="100" step="0.5" required><br>
        所属用户：
        <select name="owner" required>
            {%for user in users%}
            <option value={{user}}>{{user.last_name}}{{user.first_name}}</option>
            {%endfor%}
        </select> 
        <div class="text-center mt-4">  
            <button type="submit" class="btn btn-primary">提交</button>  
        </div>  
    </form>  
</div>  


{%endblock content%}
