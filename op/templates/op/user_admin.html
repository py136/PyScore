{% extends "op/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col">
            <h4 class="mb-3">用户列表</h4>
            {% if users %}
                <table class="table table-striped table-hover">
                    <thead class="thead-light">
                        <tr>
                            <th scope="col">姓名</th>
                            <th scope="col">用户名</th>
                            <th scope="col">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in users %}
                        <tr>
                            <td>{{ user.last_name }}{{ user.first_name }}</td>
                            <td>{{ user.username }}</td>
                            <td>
                                <a href="{% url 'check:user_info' user.username %}" class="btn btn-sm btn-outline-primary">查看详细信息</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% else %}
                <div class="alert alert-info">还没有任何用户。</div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock content %}
