<!DOCTYPE html>  
<html lang="zh-CN">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">  
    <title>PyScore</title>  
    <!-- 引入国内CDN的Bootstrap CSS -->  
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/4.5.2/css/bootstrap.min.css">  
</head>  
<body>  
    <!-- 导航栏 -->  
    <nav class="navbar navbar-expand-lg navbar-light bg-light">  
        <a class="navbar-brand" href="{% url 'op:index' %}">PyScore OP</a>  
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">  
            <span class="navbar-toggler-icon"></span>  
        </button>  
        <div class="collapse navbar-collapse" id="navbarNav">  
            <ul class="navbar-nav">  
                <li class="nav-item"><a class="nav-link" href="{% url 'op:index' %}">首页</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'check:users' %}">查看所有用户积分情况</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'check:complaints' %}">申诉</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'op:user_admin' %}">管理用户</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'check:index' %}">返回原站</a></li>
                {% if user.is_authenticated %}  
                <li class="nav-item">你好，{{ user.username }}</li>  
                {% endif %}  
            </ul>  
        </div>  
    </nav>  
  
    <!-- 内容区域 -->  
    <div class="container mt-5">  
        {% block content %}{% endblock content %}  
    </div>  
   
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>  
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>  
    <script src="https://cdn.staticfile.org/twitter-bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body> 

<!--响应各类消息-->
{% if messages %}
  {%for message in messages%}
    <script>alert("{{ message|escapejs }}");
    </script>
    
  {%endfor%}

{% endif %}
</html>
